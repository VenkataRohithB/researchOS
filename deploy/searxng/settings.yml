# SearXNG configuration for ResearchOS. Everything not set here uses SearXNG's defaults.
# The secret key comes from the SEARXNG_SECRET environment variable (see compose.yaml).
use_default_settings: true

server:
  # Only reachable from this machine (see the port binding in compose.yaml), so the
  # public-instance bot limiter would only get in the agent's way.
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  # ResearchOS consumes the JSON API, which SearXNG disables by default.
  formats:
    - html
    - json

# Spread queries over several independent engines. A research agent searches often, and any
# single engine may throttle it for a while; with several enabled, results keep coming.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: qwant
    disabled: false
  - name: mwmbl
    disabled: false
