# Local services for ResearchOS. Start with: docker compose up -d
services:
  searxng:
    image: searxng/searxng:latest
    container_name: researchos-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
